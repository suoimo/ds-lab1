[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer_churn"
version = "0.1.0"
description = "Enterprise Churn Prediction Production System"
authors = [{ name = "Enterprise MLOps Team", email = "ai-team@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "flake8>=6.0.0",
    "nbstripout>=0.7.0",
    "jupytext>=1.15.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
